<!doctype html><meta charset="utf-8"><title>Script test</title>
<body style="background:#111;color:#ddd;font:14px monospace"><pre id="o">running</pre>
<canvas id="gl" width="1920" height="1080" style="display:none"></canvas><div id="stage" style="width:1920px;display:none"><div id="text"></div></div>
<script type="module">
import { Renderer } from "./js/renderer.js";
import { Audio } from "./js/audio.js";
import { TextBox } from "./js/textbox.js";
import { VM } from "./js/vm.js";
import { run } from "./js/smoketest.js";
const gfx = new Renderer(document.getElementById("gl"));
const vm = new VM({ gfx, audio: new Audio(), text: new TextBox(), onChoice: async () => 0, playMovie: async () => {}, onWait: () => {}, toast: () => {} });
await vm.init();
const o = document.getElementById("o");
const r = await run(vm, gfx, (s) => { o.textContent = s; });
o.textContent = JSON.stringify(r, null, 1);
window.result = r;
</script></body>
